name: Probe GOAL standings shape

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-standings-shape.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
    steps:
      - name: Inspect Costa Rica standings payload keys
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) {
            throw "GOAL_API_KEY repository secret is required"
          }
          Write-Output "::add-mask::$env:GOAL_API_KEY"

          $headers = @{
            Authorization = "Bearer $env:GOAL_API_KEY"
            Accept = "application/json"
          }

          $leagueId = "cmr77dwvj00o4rx06obpfwwsh"
          $responseHeaders = $null
          $response = Invoke-RestMethod `
            -Uri "https://api.goal-api.com/v1/standings/$leagueId" `
            -Headers $headers `
            -ResponseHeadersVariable responseHeaders `
            -TimeoutSec 30

          if (-not $response.success) {
            throw "GOAL API standings probe failed"
          }

          $rows = @($response.data)
          Write-Output "STANDINGS_PROBE rows=$($rows.Count)"
          if ($rows.Count -eq 0) { exit 0 }

          $first = $rows[0]
          Write-Output "STANDINGS_KEYS=$((@($first.PSObject.Properties.Name) | Sort-Object) -join ',')"
          foreach ($prop in @($first.PSObject.Properties)) {
            if ($null -eq $prop.Value) { continue }
            if ($prop.Value -is [System.Management.Automation.PSCustomObject]) {
              Write-Output "STANDINGS_NESTED field=$($prop.Name) keys=$((@($prop.Value.PSObject.Properties.Name) | Sort-Object) -join ',')"
            }
          }