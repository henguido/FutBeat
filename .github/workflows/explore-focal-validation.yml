name: LIVE fixture close regression Linux
on:
  push:
    branches: [codex/explore-focal-validation]
permissions:
  contents: read
  statuses: write
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8348843ae292d9e3b103777f02e94ace0eb1e29
          path: source
          persist-credentials: false
      - run: test "$(git -C source rev-parse HEAD)" = "b8348843ae292d9e3b103777f02e94ace0eb1e29" && git -C source diff --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: source/apps/mobile
      - run: dart run build_runner build
        working-directory: source/apps/mobile
      - name: Repeat the exact isolated case
        working-directory: source/apps/mobile
        run: |
          failed=0
          for i in $(seq 1 12); do
            echo "Attempt $i"
            flutter test --no-pub --concurrency=1 --reporter=expanded --plain-name 'retired terminal fences share the configured page bound and clear on watch close' test/mobile261_live_terminal02_replay_test.dart || failed=1
          done
          exit "$failed"
      - name: Publish run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=live-fixture-focal -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
