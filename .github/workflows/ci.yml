name: FutBeat checks

on:
  pull_request:
    branches:
      - main
      - codex/news117-v1-ci
      - codex/news117-v2-ci
      - codex/news117-rights-ci

concurrency:
  group: futbeat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc-focal:
    if: github.event.pull_request.number == 248
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      TZ: America/Costa_Rica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify the three mobile provider guards
        run: >-
          node --test --test-name-pattern='mobile contains no provider URL or call'
          backend/test/h2h_full_history.test.mjs
          backend/test/match_h2h_v2.test.mjs
          backend/test/team_match_coverage.test.mjs
      - name: Inspect previous golden evidence
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42451140903 --name flutter-golden-failures --dir "$RUNNER_TEMP/rc248-goldens"
          python -m pip install --quiet Pillow
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageChops

          root = Path(os.environ['RUNNER_TEMP']) / 'rc248-goldens'
          names = ('matches', 'match', 'competition', 'team', 'explore', 'player')
          for name in names:
              master, = root.rglob(f'{name}_masterImage.png')
              actual, = root.rglob(f'{name}_testImage.png')
              a, b = (Image.open(p).convert('RGB') for p in (master, actual))
              if a.size != b.size:
                  print(f'{name}: dimensions {a.size} -> {b.size}')
                  continue
              diff = ImageChops.difference(a, b)
              w, h = diff.size
              bands = [sum(pixel != (0, 0, 0) for pixel in
                           diff.crop((0, y, w, min(y + 80, h))).getdata())
                       for y in range(0, h, 80)]
              print(f'{name}: {w}x{h}; bbox={diff.getbbox()}; '
                    f'changed={sum(bands)}; by 80px vertical band={bands}')
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart run build_runner build
        working-directory: apps/mobile
      - name: Verify RC auth and favorites
        working-directory: apps/mobile
        run: >-
          flutter test --no-pub --concurrency=1 --reporter=expanded
          test/onboarding_test.dart test/auth_sheet_test.dart
          test/auth_flows_test.dart test/password_reset_cold_start_test.dart
          test/favorites_hub_v2_test.dart

  contracts:
    needs: rc-focal
    if: always() && (needs.rc-focal.result == 'success' || needs.rc-focal.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend/contract changes
        id: changes
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|supabase/|packages/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No backend, Supabase or contract files changed."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      - run: npm test
        if: steps.changes.outputs.run == 'true'

      - run: npm run check
        if: steps.changes.outputs.run == 'true'

      - uses: denoland/setup-deno@v2
        if: steps.changes.outputs.run == 'true'
        with:
          deno-version: v2.9.6

      - name: Check News Edge Function types
        if: steps.changes.outputs.run == 'true'
        run: deno check supabase/functions/_shared/news_pipeline.ts supabase/functions/_shared/news_collector.ts supabase/functions/futbeat-news-collect/index.ts

  mobile:
    needs: rc-focal
    if: always() && (needs.rc-focal.result == 'success' || needs.rc-focal.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: America/Costa_Rica
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: changes
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/|packages/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No mobile checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No Flutter/mobile files changed."

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Reproducible visual timezone
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          sudo ln -snf /usr/share/zoneinfo/America/Costa_Rica /etc/localtime
          echo "America/Costa_Rica" | sudo tee /etc/timezone

      - run: flutter pub get --enforce-lockfile
        if: steps.changes.outputs.run == 'true'

      - name: Detect Drift/codegen changes
        id: codegen
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/lib/core/database\.dart$|apps/mobile/pubspec\.yaml$|apps/mobile/pubspec\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dart run build_runner build
        if: steps.changes.outputs.run == 'true' && steps.codegen.outputs.run == 'true'

      - run: flutter analyze
        if: steps.changes.outputs.run == 'true'

      - name: Run portable Flutter tests
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          find test -type f -name '*_test.dart' ! -name 'visual_test.dart' -print0 |
            xargs -0 flutter test --no-pub --concurrency=2

      - name: Run visual goldens
        if: "!cancelled() && steps.changes.outputs.run == 'true'"
        run: flutter test --no-pub --concurrency=1 test/visual_test.dart

      - name: Verify public user-session configuration offline
        if: steps.changes.outputs.run == 'true'
        run: >-
          flutter test test/public_access_auth_test.dart
          test/public_access_transport_test.dart test/public_access_wiring_test.dart
          --dart-define=FUTBEAT_USER_SESSION_ACCESS=true
          --dart-define=FUTBEAT_SUPABASE_URL=https://fixture.invalid
          --dart-define=FUTBEAT_SUPABASE_PUBLISHABLE_KEY=sb_publishable_fixture
          --dart-define=FUTBEAT_API_URL=https://fixture.invalid/functions/v1/futbeat-api

      - name: Upload Flutter golden failures
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
