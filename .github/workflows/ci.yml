name: FutBeat checks

on:
  pull_request:
    branches: [main, codex/mobile-243]

concurrency:
  group: futbeat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend/contract changes
        id: changes
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|supabase/|packages/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No backend, Supabase or contract files changed."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      - run: npm test
        if: steps.changes.outputs.run == 'true'

      - run: npm run check
        if: steps.changes.outputs.run == 'true'

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Costa_Rica
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: changes
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/|packages/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No mobile checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No Flutter/mobile files changed."

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Reproducible visual timezone
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          sudo ln -snf /usr/share/zoneinfo/America/Costa_Rica /etc/localtime
          echo "America/Costa_Rica" | sudo tee /etc/timezone

      - run: flutter pub get --enforce-lockfile
        if: steps.changes.outputs.run == 'true'

      - name: Detect Drift/codegen changes
        id: codegen
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/lib/core/database\.dart$|apps/mobile/pubspec\.yaml$|apps/mobile/pubspec\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dart run build_runner build
        if: steps.changes.outputs.run == 'true' && steps.codegen.outputs.run == 'true'

      - run: flutter analyze
        if: steps.changes.outputs.run == 'true'

      - name: Run portable Flutter tests
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          find test -type f -name '*_test.dart' ! -name 'visual_test.dart' -print0 |
            xargs -0 flutter test

      - name: Attribute MOBILE244 golden failures against its exact base
        if: failure() && github.base_ref == 'codex/mobile-243' && steps.changes.outputs.run == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diagnostic only: the original test step remains failed. No reference
          # updates, threshold changes, or exclusions are introduced here.
          base_dir="$RUNNER_TEMP/mobile244-golden-base"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$base_dir" "$BASE_SHA"
          flutter --version --machine > "$RUNNER_TEMP/mobile244-flutter.json"
          printf 'BASE=%s PR_HEAD=%s TESTED_SHA=%s TZ=%s\n' "$BASE_SHA" "$HEAD_SHA" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "$TZ" > "$RUNNER_TEMP/mobile244-baseline.log"
          cd "$base_dir/apps/mobile"
          sha256sum pubspec.lock assets/fonts/*.ttf >> "$RUNNER_TEMP/mobile244-baseline.log"
          flutter pub get --offline --enforce-lockfile >> "$RUNNER_TEMP/mobile244-baseline.log" 2>&1
          set +e
          flutter test --no-pub --reporter expanded \
            test/lineups_match_center_visual_test.dart test/lineups_visual_test.dart \
            test/standings_ux_v2_test.dart test/match_timeline_v2_test.dart \
            test/favorites_hub_v2_test.dart >> "$RUNNER_TEMP/mobile244-baseline.log" 2>&1
          baseline_exit=$?
          set -e
          printf '\nBASELINE_EXIT=%s\n' "$baseline_exit" >> "$RUNNER_TEMP/mobile244-baseline.log"
          cd "$GITHUB_WORKSPACE/apps/mobile"
          sha256sum pubspec.lock assets/fonts/*.ttf > "$RUNNER_TEMP/mobile244-head-inputs.log"
          python3 tool/compare_golden_renders.py test/failures "$base_dir/apps/mobile/test/failures" \
            --output "$RUNNER_TEMP/mobile244-render-comparison.json"

      - name: Upload MOBILE244 baseline attribution
        if: failure() && github.base_ref == 'codex/mobile-243' && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile244-baseline-attribution
          path: |
            ${{ runner.temp }}/mobile244-golden-base/apps/mobile/test/failures/
            ${{ runner.temp }}/mobile244-baseline.log
            ${{ runner.temp }}/mobile244-head-inputs.log
            ${{ runner.temp }}/mobile244-flutter.json
            ${{ runner.temp }}/mobile244-render-comparison.json
          if-no-files-found: warn

      - name: Upload Flutter golden failures
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
