name: FutBeat checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: futbeat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend/contract changes
        id: changes
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|supabase/|packages/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No backend, Supabase or contract files changed."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      - run: npm test
        if: steps.changes.outputs.run == 'true'

      - run: npm run check
        if: steps.changes.outputs.run == 'true'

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Costa_Rica
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: changes
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/|packages/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No mobile checks needed
        if: steps.changes.outputs.run != 'true'
        run: echo "No Flutter/mobile files changed."

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Reproducible visual timezone
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          sudo ln -snf /usr/share/zoneinfo/America/Costa_Rica /etc/localtime
          echo "America/Costa_Rica" | sudo tee /etc/timezone

      - run: flutter pub get --enforce-lockfile
        if: steps.changes.outputs.run == 'true'

      - name: Detect Drift/codegen changes
        id: codegen
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/mobile/lib/core/database\.dart$|apps/mobile/pubspec\.yaml$|apps/mobile/pubspec\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dart run build_runner build
        if: steps.changes.outputs.run == 'true' && steps.codegen.outputs.run == 'true'

      - run: flutter analyze
        if: steps.changes.outputs.run == 'true'

      - name: Run portable Flutter tests
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          find test -type f -name '*_test.dart' ! -name 'visual_test.dart' -print0 |
            xargs -0 flutter test

      - name: Build FutBeat debug APK
        if: steps.changes.outputs.run == 'true'
        run: flutter build apk --debug

      - name: Upload FutBeat debug APK
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futbeat-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Flutter golden failures
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
