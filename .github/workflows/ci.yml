name: FutBeat checks
on:
  pull_request:
    branches: [main]
concurrency:
  group: futbeat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
  mobile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Reproducible visual timezone
        run: tzutil /s "Central America Standard Time"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Format mobile sources for beta build
        run: dart format lib test
      - run: flutter analyze
      - name: Build FutBeat debug APK
        run: flutter build apk --debug
      - name: Upload FutBeat debug APK
        uses: actions/upload-artifact@v4
        with:
          name: futbeat-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - run: flutter test
      - name: Upload Flutter golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
      - name: Expose failed visual goldens
        if: failure()
        run: |
          $files = @{
            "MATCH_GOLDEN_BASE64" = "test/failures/match_testImage.png"
            "MATCHES_GOLDEN_BASE64" = "test/failures/matches_testImage.png"
          }
          foreach ($key in $files.Keys) {
            $path = $files[$key]
            if (Test-Path $path) {
              $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
              Write-Output "$key=$encoded"
            }
          }
