name: FutBeat checks
on:
  pull_request:
    branches: [main]
concurrency:
  group: futbeat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
  mobile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Reproducible visual timezone
        run: tzutil /s "Central America Standard Time"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Format mobile sources for beta build
        run: dart format lib test
      - run: flutter analyze
      - name: Smoke global daily schedule
        shell: pwsh
        run: |
          $date = (Get-Date).ToString("yyyy-MM-dd")
          $headers = @{
            "Accept" = "application/json,text/plain,*/*"
            "Origin" = "https://www.sofascore.com"
            "Referer" = "https://www.sofascore.com/"
            "User-Agent" = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"
          }
          $urls = @(
            "https://api.sofascore.com/api/v1/sport/football/scheduled-events/$date",
            "https://www.sofascore.com/api/v1/sport/football/scheduled-events/$date"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              $response = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 15
              $count = @($response.events).Count
              if ($count -gt 0) {
                Write-Output "GLOBAL_SMOKE_OK url=$url events=$count"
                $ok = $true
                break
              }
            } catch {
              Write-Warning "Global schedule smoke failed for $url: $($_.Exception.Message)"
            }
          }
          if (-not $ok) {
            Write-Warning "Global schedule unavailable from this CI runner; mobile keeps the canonical FutBeat snapshot as fallback."
          }
      - run: flutter test
      - name: Upload Flutter golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore
      - name: Build FutBeat debug APK
        run: flutter build apk --debug
      - name: Upload FutBeat debug APK
        uses: actions/upload-artifact@v4
        with:
          name: futbeat-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
