name: FutBeat global schedule

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: futbeat-global-schedule
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch global schedule
        run: node backend/automation/global_schedule_payload.mjs global_schedule_payload.json

      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token="$(
            curl --fail --silent --show-error               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=futbeat-global-ingest" |
              python3 -c "import json,sys; print(json.load(sys.stdin)['value'])"
          )"
          test -n "$token"
          echo "::add-mask::$token"
          echo "FUTBEAT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish once to FutBeat backend
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer ${FUTBEAT_OIDC_TOKEN}"               -H "Content-Type: application/json"               --data-binary @global_schedule_payload.json               "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest"
          )"
          echo "$response"
          python3 -c "import json,sys; data=json.loads(sys.argv[1]); assert data.get('status') in ('ok','skipped'), data" "$response"
