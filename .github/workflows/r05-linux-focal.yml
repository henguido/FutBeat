name: R05 Linux focal
on:
  push:
    branches: [codex/r05-linux-focal]
permissions:
  contents: read
jobs:
  r05:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart run build_runner build
        working-directory: apps/mobile
      - run: flutter test --no-pub --concurrency=1 --reporter=expanded test/account_deletion_receipt_test.dart test/mobile261_account_delete02_reopen_test.dart
        working-directory: apps/mobile
