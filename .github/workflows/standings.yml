name: FutBeat standings

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-standings
  cancel-in-progress: false

jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
    steps:
      - name: Refresh one due league table
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) {
            throw "GOAL_API_KEY repository secret is required"
          }
          Write-Output "::add-mask::$env:GOAL_API_KEY"

          function Get-GitHubOidcToken {
            $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
            $oidc = Invoke-RestMethod -Uri $oidcUrl -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            } -TimeoutSec 15
            $token = [string]$oidc.value
            if ([string]::IsNullOrWhiteSpace($token)) {
              throw "GitHub OIDC token was not issued"
            }
            Write-Host "::add-mask::$token"
            return $token
          }

          function Invoke-FutBeatEndpoint([object]$payload) {
            $token = Get-GitHubOidcToken
            $body = $payload | ConvertTo-Json -Depth 100 -Compress
            return Invoke-RestMethod -Uri "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest" `
              -Method Post `
              -Headers @{ Authorization = "Bearer $token" } `
              -ContentType "application/json" `
              -Body $body `
              -TimeoutSec 60
          }

          $plan = Invoke-FutBeatEndpoint ([ordered]@{
            action = "standings-plan"
          })

          if ($plan.status -eq "skipped") {
            Write-Output "STANDINGS_SKIPPED reason=$($plan.reservation.reason) remaining=$($plan.reservation.providerRemaining)"
            exit 0
          }

          # BEGIN standings-outcome
          # Mirrors classifyGoalStandingsResponse in
          # supabase/functions/_shared/goal_standings.ts (same cases tested
          # against both in backend/test/standings_coverage_no_data.test.mjs).
          # Generic: no league id or name is special-cased.
          function Get-GoalProviderCode([object]$Body) {
            if ($null -eq $Body -or $Body -is [System.Array]) { return "" }
            $nested = $null
            if ($Body.error -is [System.Management.Automation.PSCustomObject]) { $nested = $Body.error.code }
            foreach ($value in @($Body.code, $Body.errorCode, $nested)) {
              if ($value -is [string] -and -not [string]::IsNullOrWhiteSpace($value)) {
                return $value.Trim().ToUpperInvariant()
              }
            }
            return ""
          }

          # Status 0 = no HTTP response (network error or timeout).
          function Get-StandingsOutcome([int]$Status, [object]$Body) {
            $code = Get-GoalProviderCode $Body
            if ($Status -lt 100) { return @{ action = "standings-fail"; code = "GOAL_STANDINGS_NETWORK" } }
            if ($Status -eq 401 -or $Status -eq 403) { return @{ action = "standings-fail"; code = "GOAL_STANDINGS_AUTH" } }
            if ($Status -eq 429) { return @{ action = "standings-fail"; code = "GOAL_STANDINGS_RATE_LIMITED" } }
            if ($Status -ge 500) { return @{ action = "standings-fail"; code = "GOAL_STANDINGS_HTTP_5XX" } }
            $success2xx = $Status -ge 200 -and $Status -lt 300
            if ($code -eq "STANDINGS_NOT_FOUND" -and ($Status -eq 404 -or $success2xx)) {
              return @{ action = "standings-no-data"; code = "STANDINGS_NOT_FOUND" }
            }
            if (-not $success2xx) { return @{ action = "standings-fail"; code = "GOAL_STANDINGS_HTTP_$Status" } }
            if ($null -eq $Body -or $Body -is [System.Array] -or -not ($Body.success -is [bool] -and $Body.success) -or
                -not ($Body.data -is [System.Array])) {
              return @{ action = "standings-fail"; code = "GOAL_STANDINGS_INVALID_PAYLOAD" }
            }
            if (@($Body.data).Count -ge 2) { return @{ action = "standings-ingest"; code = "OK" } }
            return @{ action = "standings-no-data"; code = "EMPTY_STANDINGS" }
          }
          # END standings-outcome

          $reservationId = [int]$plan.reservation.reservationId
          $competitionId = [string]$plan.reservation.competitionId
          $externalLeagueId = [string]$plan.reservation.externalLeagueId
          $remaining = $null
          $status = 0
          $body = $null
          $transportError = ""

          # Invoke-WebRequest -SkipHttpErrorCheck keeps the HTTP status, the
          # JSON body and X-RateLimit-Remaining for 4xx/5xx answers too
          # (Invoke-RestMethod threw before the body could be read).
          try {
            $uri = "https://api.goal-api.com/v1/standings/$externalLeagueId"
            $response = Invoke-WebRequest -Uri $uri `
              -Headers @{
                Authorization = "Bearer $env:GOAL_API_KEY"
                Accept = "application/json"
              } `
              -SkipHttpErrorCheck `
              -TimeoutSec 30
            $status = [int]$response.StatusCode
            $rawRemaining = @($response.Headers["X-RateLimit-Remaining"])[0]
            if (-not [string]::IsNullOrWhiteSpace([string]$rawRemaining)) {
              $remaining = [int]$rawRemaining
            }
            try { $body = [string]$response.Content | ConvertFrom-Json } catch { $body = $null }
          } catch {
            $status = 0
            $transportError = $_.Exception.Message
          }

          $outcome = Get-StandingsOutcome $status $body
          $httpStatus = $null
          if ($status -ge 100) { $httpStatus = $status }

          if ($outcome.action -eq "standings-no-data") {
            $result = Invoke-FutBeatEndpoint ([ordered]@{
              action = "standings-no-data"
              reservationId = $reservationId
              competitionId = $competitionId
              externalLeagueId = $externalLeagueId
              providerRemaining = $remaining
              httpStatus = $httpStatus
              providerCode = $outcome.code
            })
            Write-Output "STANDINGS_NO_DATA competition=$competitionId code=$($outcome.code) status=$status retryAt=$($result.retryAt) remaining=$remaining"
            exit 0
          }

          if ($outcome.action -eq "standings-ingest") {
            $season = ""
            $first = @($body.data)[0]
            foreach ($field in @("season","leagueSeason","overallLeagueSeason")) {
              if (-not [string]::IsNullOrWhiteSpace([string]$first.$field)) {
                $season = [string]$first.$field
                break
              }
            }

            $result = Invoke-FutBeatEndpoint ([ordered]@{
              action = "standings-ingest"
              reservationId = $reservationId
              competitionId = $competitionId
              externalLeagueId = $externalLeagueId
              season = $season
              providerRemaining = $remaining
              rows = @($body.data)
            })

            Write-Output "STANDINGS_OK competition=$competitionId rows=$($result.rows) remaining=$remaining"
            exit 0
          }

          # Real failure: recorded as FAILED and the run stays red.
          try {
            Invoke-FutBeatEndpoint ([ordered]@{
              action = "standings-fail"
              reservationId = $reservationId
              competitionId = $competitionId
              externalLeagueId = $externalLeagueId
              providerRemaining = $remaining
              errorCode = $outcome.code
              providerCode = (Get-GoalProviderCode $body)
              httpStatus = $httpStatus
            }) | Out-Null
          } catch {
            Write-Warning "STANDINGS_FAILURE_RECORD_FAILED"
          }
          throw "GOAL standings request failed code=$($outcome.code) status=$status $transportError"
