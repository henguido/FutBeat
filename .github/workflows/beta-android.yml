name: FutBeat Android beta

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: FutBeat API base URL
        required: true
        default: https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-api
      public_token:
        description: Supabase publishable token
        required: true
        default: sb_publishable_iSH4S3fKou_EEkdG3W_Azg_9E4HXzWE

permissions:
  contents: read

concurrency:
  group: futbeat-beta-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Reproducible visual timezone
        run: tzutil /s "Central America Standard Time"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Create cloud build configuration
        shell: pwsh
        env:
          FUTBEAT_API_URL: ${{ inputs.api_url }}
          FUTBEAT_API_PUBLIC_TOKEN: ${{ inputs.public_token }}
        run: |
          @{
            FUTBEAT_API_URL = $env:FUTBEAT_API_URL
            FUTBEAT_API_PUBLIC_TOKEN = $env:FUTBEAT_API_PUBLIC_TOKEN
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\futbeat-cloud-build.json"
      - name: Build connected debug APK
        shell: pwsh
        run: flutter build apk --debug --dart-define-from-file="$env:RUNNER_TEMP\futbeat-cloud-build.json"
      - uses: actions/upload-artifact@v4
        with:
          name: futbeat-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
