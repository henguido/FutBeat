name: FutBeat Android beta

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: FutBeat API base URL
        required: true
        default: https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-api
      public_token:
        description: Supabase publishable token
        required: true
        default: sb_publishable_iSH4S3fKou_EEkdG3W_Azg_9E4HXzWE
      # Push notifications (docs/notifications.md). Disabled unless all of
      # these are provided; public Firebase options only, never secrets.
      # push_enabled:
      #   description: Set FUTBEAT_PUSH_ENABLED=true
      #   required: false
      #   default: 'false'
      # firebase_api_key:
      #   description: FUTBEAT_FIREBASE_API_KEY (public)
      #   required: false
      # firebase_app_id:
      #   description: FUTBEAT_FIREBASE_APP_ID
      #   required: false
      # firebase_sender_id:
      #   description: FUTBEAT_FIREBASE_SENDER_ID
      #   required: false
      # firebase_project_id:
      #   description: FUTBEAT_FIREBASE_PROJECT_ID
      #   required: false

permissions:
  contents: read

concurrency:
  group: futbeat-beta-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Reproducible visual timezone
        run: tzutil /s "Central America Standard Time"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Create cloud build configuration
        shell: pwsh
        env:
          FUTBEAT_API_URL: ${{ inputs.api_url }}
          FUTBEAT_API_PUBLIC_TOKEN: ${{ inputs.public_token }}
        run: |
          @{
            FUTBEAT_API_URL = $env:FUTBEAT_API_URL
            FUTBEAT_API_PUBLIC_TOKEN = $env:FUTBEAT_API_PUBLIC_TOKEN
            # Push (uncomment together with the inputs above):
            # FUTBEAT_PUSH_ENABLED = <inputs.push_enabled>
            # FUTBEAT_FIREBASE_API_KEY = <inputs.firebase_api_key>
            # FUTBEAT_FIREBASE_APP_ID = <inputs.firebase_app_id>
            # FUTBEAT_FIREBASE_SENDER_ID = <inputs.firebase_sender_id>
            # FUTBEAT_FIREBASE_PROJECT_ID = <inputs.firebase_project_id>
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\futbeat-cloud-build.json"
      - name: Build connected debug APK
        shell: pwsh
        run: flutter build apk --debug --dart-define-from-file="$env:RUNNER_TEMP\futbeat-cloud-build.json"
      - uses: actions/upload-artifact@v4
        with:
          name: futbeat-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
