name: FutBeat Android beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futbeat-beta-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Reproducible visual timezone
        run: tzutil /s "Central America Standard Time"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: futbeat-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
