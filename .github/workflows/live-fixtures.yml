name: FutBeat live transport bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-fixtures.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-live-transport-bootstrap
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
    steps:
      - name: Provision GOAL LIVE transport in Supabase
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) {
            throw "GOAL_API_KEY repository secret is required"
          }
          Write-Output "::add-mask::$env:GOAL_API_KEY"

          $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
          $oidc = Invoke-RestMethod -Uri $oidcUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -TimeoutSec 15
          $token = [string]$oidc.value
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "GitHub OIDC token was not issued"
          }
          Write-Output "::add-mask::$token"

          $payload = [ordered]@{
            action = "goal-live-secret-provision"
            goalApiKey = $env:GOAL_API_KEY
          } | ConvertTo-Json -Compress

          $result = Invoke-RestMethod -Uri "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest" -Method Post -Headers @{ Authorization = "Bearer $token" } -ContentType "application/json" -Body $payload -TimeoutSec 60

          if ($result.status -ne "ok") {
            throw "Supabase LIVE transport provisioning failed"
          }

          Write-Output "GOAL_LIVE_TRANSPORT_PROVISIONED transport=$($result.transport.transport) schedule=$($result.transport.schedule)"
