name: FutBeat live scores

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-fixtures.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-live-fixtures
  cancel-in-progress: false

jobs:
  # Highest GOAL API quota priority. The database guard preserves only
  # the emergency reserve; catalog/detail work stops earlier.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
    steps:
      - name: Sync GOAL API live matches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) {
            throw "GOAL_API_KEY repository secret is required"
          }
          Write-Output "::add-mask::$env:GOAL_API_KEY"

          function Get-GitHubOidcToken {
            $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
            $oidc = Invoke-RestMethod -Uri $oidcUrl -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            } -TimeoutSec 15
            $token = [string]$oidc.value
            if ([string]::IsNullOrWhiteSpace($token)) {
              throw "GitHub OIDC token was not issued"
            }
            Write-Host "::add-mask::$token"
            return $token
          }

          function Invoke-FutBeatLiveEndpoint([object]$payload) {
            $token = Get-GitHubOidcToken
            $body = $payload | ConvertTo-Json -Depth 100 -Compress
            return Invoke-RestMethod -Uri "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest" `
              -Method Post `
              -Headers @{ Authorization = "Bearer $token" } `
              -ContentType "application/json" `
              -Body $body `
              -TimeoutSec 60
          }

          $plan = Invoke-FutBeatLiveEndpoint ([ordered]@{
            action = "live-plan"
          })

          $remaining = $null

          if ($plan.status -eq "skipped") {
            Write-Output "GOAL_LIVE_SKIPPED reason=$($plan.reservation.reason)"
          } else {
            $reservationId = [int]$plan.reservation.reservationId

            try {
            $events = New-Object System.Collections.Generic.List[object]
            $seen = @{}
            $offset = 0
            $pageLimit = 100
            $providerRequests = 0
            $providerTotal = $null
            $hasMore = $true

            while ($hasMore) {
              $responseHeaders = $null
              $uri = "https://api.goal-api.com/v1/fixtures/live?limit=100&offset=$offset"
              $response = Invoke-RestMethod -Uri $uri `
                -Headers @{
                  Authorization = "Bearer $env:GOAL_API_KEY"
                  Accept = "application/json"
                } `
                -ResponseHeadersVariable responseHeaders `
                -TimeoutSec 30

              $providerRequests += 1

              if (-not $response.success -or -not ($response.PSObject.Properties.Name -contains "data")) {
                throw "GOAL API returned an invalid live fixtures payload at offset $offset"
              }

              if ($null -ne $responseHeaders) {
                $rawRemaining = @($responseHeaders["X-RateLimit-Remaining"])[0]
                if (-not [string]::IsNullOrWhiteSpace([string]$rawRemaining)) {
                  $remaining = [int]$rawRemaining
                }
              }

              foreach ($fixture in @($response.data)) {
                $externalId = [string]$fixture.apiId
                if ([string]::IsNullOrWhiteSpace($externalId)) {
                  $externalId = [string]$fixture.id
                }
                if ([string]::IsNullOrWhiteSpace($externalId) -or $seen.ContainsKey($externalId)) {
                  continue
                }
                $seen[$externalId] = $true
                [void]$events.Add($fixture)
              }

              $hasMore = $false
              if ($null -ne $response.pagination) {
                if ($null -ne $response.pagination.total) {
                  $providerTotal = [int]$response.pagination.total
                }
                if ([int]$response.pagination.limit -gt 0) {
                  $pageLimit = [int]$response.pagination.limit
                }
                $hasMore = [bool]$response.pagination.hasMore
              }

              if ($hasMore) {
                $offset += $pageLimit
              }
            }

            $result = Invoke-FutBeatLiveEndpoint ([ordered]@{
              action = "live-ingest"
              reservationId = $reservationId
              providerRemaining = $remaining
              providerRequests = $providerRequests
              providerTotal = $providerTotal
              events = $events.ToArray()
            })

            Write-Output "GOAL_LIVE_OK matches=$($result.liveMatches) mapped=$($result.linkedMatches) unmapped=$($result.unmappedMatches) total=$providerTotal pages=$providerRequests remaining=$remaining"
          } catch {
            try {
              Invoke-FutBeatLiveEndpoint ([ordered]@{
                action = "live-fail"
                reservationId = $reservationId
                providerRemaining = $remaining
                errorCode = "GOAL_LIVE_FETCH_FAILED"
                httpStatus = $null
              }) | Out-Null
            } catch {
              Write-Warning "GOAL_LIVE_FAILURE_RECORD_FAILED"
            }
            throw
          }
          }

          $detailPlan = Invoke-FutBeatLiveEndpoint ([ordered]@{
            action = "match-detail-plan"
          })

          if ($detailPlan.status -eq "skipped") {
            Write-Output "GOAL_MATCH_DETAIL_SKIPPED reason=$($detailPlan.reservation.reason)"
            exit 0
          }

          $detailReservationId = [int]$detailPlan.reservation.reservationId
          $detailMatchId = [string]$detailPlan.reservation.matchId
          $detailExternalId = [string]$detailPlan.reservation.externalMatchId
          $detailRemaining = $remaining

          try {
            $detailHeaders = $null
            $detailResponse = Invoke-RestMethod `
              -Uri "https://api.goal-api.com/v1/fixtures/$detailExternalId" `
              -Headers @{
                Authorization = "Bearer $env:GOAL_API_KEY"
                Accept = "application/json"
              } `
              -ResponseHeadersVariable detailHeaders `
              -TimeoutSec 30

            if (-not $detailResponse.success -or -not ($detailResponse.PSObject.Properties.Name -contains "data")) {
              throw "GOAL API returned an invalid match detail payload"
            }

            if ($null -ne $detailHeaders) {
              $rawRemaining = @($detailHeaders["X-RateLimit-Remaining"])[0]
              if (-not [string]::IsNullOrWhiteSpace([string]$rawRemaining)) {
                $detailRemaining = [int]$rawRemaining
              }
            }

            $detailResult = Invoke-FutBeatLiveEndpoint ([ordered]@{
              action = "match-detail-ingest"
              reservationId = $detailReservationId
              matchId = $detailMatchId
              externalMatchId = $detailExternalId
              providerRemaining = $detailRemaining
              detail = $detailResponse.data
            })

            Write-Output "GOAL_MATCH_DETAIL_OK match=$detailMatchId external=$detailExternalId remaining=$detailRemaining"
          } catch {
            try {
              Invoke-FutBeatLiveEndpoint ([ordered]@{
                action = "match-detail-fail"
                reservationId = $detailReservationId
                matchId = $detailMatchId
                externalMatchId = $detailExternalId
                providerRemaining = $detailRemaining
                errorCode = "GOAL_MATCH_DETAIL_FETCH_FAILED"
                httpStatus = $null
              }) | Out-Null
            } catch {
              Write-Warning "GOAL_MATCH_DETAIL_FAILURE_RECORD_FAILED"
            }
            throw
          }
