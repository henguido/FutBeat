name: FutBeat global fixtures

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-fixtures.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-global-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Collect and ingest global football calendar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $crNow = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-6))
          $dates = @(-1, 0, 1) | ForEach-Object {
            $crNow.Date.AddDays($_).ToString("yyyy-MM-dd")
          }
          $from = $dates[0].Replace("-", "")
          $to = $dates[2].Replace("-", "")

          $url = "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=$from-$to&limit=1000"
          $fetchParams = @{
            Uri = $url
            Headers = @{ "Accept" = "application/json" }
            TimeoutSec = 30
          }
          $response = Invoke-RestMethod @fetchParams

          if (-not ($response.PSObject.Properties.Name -contains "events")) {
            throw "ESPN returned an invalid scoreboard payload"
          }

          $events = @($response.events)
          if ($events.Count -eq 0) {
            throw "ESPN returned zero football events for the requested range"
          }

          Write-Output "GLOBAL_FETCH provider=ESPN from=$($dates[0]) to=$($dates[2]) events=$($events.Count)"

          $payloadObject = [ordered]@{
            source = "ESPN"
            dates = @($dates)
            events = @($events)
          }
          $payloadObject |
            ConvertTo-Json -Depth 100 -Compress |
            Set-Content -Path "global-fixtures.json" -Encoding utf8NoBOM

          $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
          $oidcParams = @{
            Uri = $oidcUrl
            Headers = @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            TimeoutSec = 15
          }
          $oidc = Invoke-RestMethod @oidcParams

          $token = [string]$oidc.value
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "GitHub OIDC token was not issued"
          }
          Write-Output "::add-mask::$token"

          $body = Get-Content -Raw -Path "global-fixtures.json"
          $ingestParams = @{
            Uri = "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest"
            Method = "Post"
            Headers = @{ Authorization = "Bearer $token" }
            ContentType = "application/json"
            Body = $body
            TimeoutSec = 90
          }
          $result = Invoke-RestMethod @ingestParams

          Write-Output "GLOBAL_INGEST_OK provider=ESPN"
          $result | ConvertTo-Json -Depth 20 -Compress
