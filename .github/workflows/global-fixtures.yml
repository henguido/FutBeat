name: FutBeat global fixtures

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-global-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
      CALENDAR_PENDING_DIR: ${{ github.workspace }}/calendar-pending
    steps:
      # Dates already paid to GOAL that failed to store (11-01: 27 pages lost, and the
      # next three runs were below the reserve). Newest cache wins; see Resume-PendingDates.
      - name: Restore paid calendar dates
        uses: actions/cache/restore@v4
        with:
          path: calendar-pending
          key: calendar-pending-${{ github.run_id }}
          restore-keys: calendar-pending-

      - name: Collect and ingest global football calendar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) {
            throw "GOAL_API_KEY repository secret is required"
          }
          Write-Output "::add-mask::$env:GOAL_API_KEY"

          function Get-GitHubOidcToken {
            $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
            $oidc = Invoke-RestMethod -Uri $oidcUrl -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            } -TimeoutSec 15
            $token = [string]$oidc.value
            if ([string]::IsNullOrWhiteSpace($token)) {
              throw "GitHub OIDC token was not issued"
            }
            Write-Host "::add-mask::$token"
            return $token
          }

          function Invoke-FutBeatGlobalEndpoint([object]$payload, [int]$timeoutSec = 90) {
            $token = Get-GitHubOidcToken
            $body = $payload | ConvertTo-Json -Depth 100 -Compress
            return Invoke-RestMethod -Uri "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest" `
              -Method Post `
              -Headers @{ Authorization = "Bearer $token" } `
              -ContentType "application/json" `
              -Body $body `
              -TimeoutSec $timeoutSec
          }

          # $stopAtRemaining: a date is ingested whole or not at all (the store removes
          # what its snapshot lacks), so a long date stops here instead of crossing the
          # reserve. Partial = true, nothing to ingest, the date stays in the plan.
          function Get-GoalApiDate([string]$date, [int]$stopAtRemaining = 0) {
            $items = New-Object System.Collections.Generic.List[object]
            $offset = 0
            $remaining = $null
            $requests = 0
            $partial = $false

            do {
              $uri = "https://api.goal-api.com/v1/fixtures/date/${date}?limit=100&offset=$offset"
              $responseHeaders = $null
              $response = Invoke-RestMethod -Uri $uri -Headers @{
                Authorization = "Bearer $env:GOAL_API_KEY"
                Accept = "application/json"
              } -ResponseHeadersVariable responseHeaders -TimeoutSec 30

              $requests += 1

              if (-not $response.success -or -not ($response.PSObject.Properties.Name -contains "data")) {
                throw "GOAL API returned an invalid fixtures payload for $date"
              }

              foreach ($fixture in @($response.data)) {
                [void]$items.Add($fixture)
              }

              if ($null -ne $responseHeaders) {
                $rawRemaining = @($responseHeaders["X-RateLimit-Remaining"])[0]
                if (-not [string]::IsNullOrWhiteSpace([string]$rawRemaining)) {
                  $remaining = [int]$rawRemaining
                }
              }

              $hasMore = $false
              $pageLimit = 100
              if ($null -ne $response.pagination) {
                $hasMore = [bool]$response.pagination.hasMore
                if ([int]$response.pagination.limit -gt 0) {
                  $pageLimit = [int]$response.pagination.limit
                }
              }
              $offset += $pageLimit
              if ($hasMore -and $null -ne $remaining -and $remaining -le $stopAtRemaining) {
                $partial = $true
                break
              }
            } while ($hasMore)

            return [pscustomobject]@{
              Date = $date
              Items = $items.ToArray()
              Count = $items.Count
              Remaining = $remaining
              Requests = $requests
              Partial = $partial
            }
          }

          # A date is kept only while it is worth storing: older data would go in as
          # fetched now. Files stay until stored or expired.
          $pendingDir = if ($env:CALENDAR_PENDING_DIR) { $env:CALENDAR_PENDING_DIR } else { Join-Path ([IO.Path]::GetTempPath()) "calendar-pending-$PID" }
          $pendingMaxHours = 30
          $pendingPerRun = 3
          [void](New-Item -ItemType Directory -Force -Path $pendingDir)
          Set-Content -Path (Join-Path $pendingDir ".keep") -Value "keep"
          $calendarCallSeconds = 140
          $hotFailed = $false
          $calendarFailures = 0

          function Get-PendingPath([string]$date) {
            return Join-Path $pendingDir "$date.json"
          }

          function Save-PendingDate([object]$payload) {
            $date = @($payload.dates)[0]
            $file = [ordered]@{ savedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); payload = $payload }
            Set-Content -Path (Get-PendingPath $date) -Value ($file | ConvertTo-Json -Depth 100 -Compress)
            Write-Output "CALENDAR_PENDING_SAVED date=$date"
          }

          # Costs no GOAL page, so it runs below the reserve too. The first failure
          # ends it: the database is not ready for the next one either.
          function Resume-PendingDates {
            $resumed = 0
            foreach ($item in @(Get-ChildItem -Path $pendingDir -Filter "*.json" | Sort-Object Name)) {
              $file = Get-Content -Path $item.FullName -Raw | ConvertFrom-Json -Depth 100
              $ageHours = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$file.savedAt) / 3600
              if ($ageHours -ge $pendingMaxHours) {
                Remove-Item -Path $item.FullName
                Write-Output "CALENDAR_RESUME_EXPIRED date=$($item.BaseName)"
                continue
              }
              if ($resumed -ge $pendingPerRun) { break }
              $resumed += 1
              try {
                $result = Invoke-FutBeatGlobalEndpoint $file.payload $calendarCallSeconds
              } catch {
                $script:calendarFailures += 1
                Write-Output "CALENDAR_RESUME_FAILED date=$($item.BaseName) error=$($_.Exception.Message)"
                break
              }
              if ($result.status -eq "skipped") {
                Write-Output "CALENDAR_RESUME_STOP reason=ingest_skipped detail=$($result.reason)"
                break
              }
              Remove-Item -Path $item.FullName
              Write-Output "CALENDAR_RESUME_OK date=$($item.BaseName) accepted=$($result.accepted)"
            }
          }

          Resume-PendingDates

          $globalReserve = 350
          $expandFreshQuota = 650
          $globalQuota = Invoke-FutBeatGlobalEndpoint ([ordered]@{
            action = "global-quota-plan"
            reserve = $globalReserve
          })
          if ($globalQuota.status -eq "skipped") {
            Write-Output "GLOBAL_FETCH_SKIPPED reason=$($globalQuota.plan.reason) remaining=$($globalQuota.plan.providerRemaining) reserve=$globalReserve"
            exit 0
          }

          function Invoke-HotWindow {
          # Hot window: yesterday / today / tomorrow in Costa Rica.
          $crNow = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-6))
          $dates = @(-1, 0, 1) | ForEach-Object {
            $crNow.Date.AddDays($_).ToString("yyyy-MM-dd")
          }
          $windowStart = [DateTimeOffset]::Parse("$($dates[0])T00:00:00-06:00")
          $windowEnd = [DateTimeOffset]::Parse("$($crNow.Date.AddDays(2).ToString("yyyy-MM-dd"))T00:00:00-06:00")

          $fetchDates = New-Object System.Collections.Generic.List[string]
          $cursor = $windowStart.UtcDateTime.Date
          $lastUtcDate = $windowEnd.UtcDateTime.Date
          while ($cursor -le $lastUtcDate) {
            [void]$fetchDates.Add($cursor.ToString("yyyy-MM-dd"))
            $cursor = $cursor.AddDays(1)
          }

          $fixtures = New-Object System.Collections.Generic.List[object]
          $seen = @{}
          $hotRemaining = $null
          foreach ($date in $fetchDates) {
            $page = Get-GoalApiDate $date
            if ($null -ne $page.Remaining) {
              $hotRemaining = [int]$page.Remaining
            }
            foreach ($fixture in @($page.Items)) {
              $externalId = [string]$fixture.apiId
              if ([string]::IsNullOrWhiteSpace($externalId)) {
                $externalId = [string]$fixture.id
              }
              if ([string]::IsNullOrWhiteSpace($externalId) -or $seen.ContainsKey($externalId)) {
                continue
              }
              $seen[$externalId] = $true
              [void]$fixtures.Add($fixture)
            }
          }

          $events = @($fixtures | Where-Object {
            $kickoff = [DateTimeOffset]::MinValue
            [DateTimeOffset]::TryParse([string]$_.kickoffUtc, [ref]$kickoff) -and
              $kickoff -ge $windowStart -and $kickoff -lt $windowEnd
          })

          if ($events.Count -eq 0) {
            throw "GOAL API returned zero fixtures inside the Costa Rica snapshot window"
          }

          Write-Output "GLOBAL_FETCH provider=GOAL_API from=$($dates[0]) to=$($dates[2]) utcDates=$($fetchDates.Count) fixtures=$($events.Count)"

          # A failed hot store must not block the cold calendar (BE-173: 10-30 00:57
          # the window store hit 57014 and the run stopped before the expansion, so
          # the missing dates never ran). The calendar ingests per date with its own
          # stores; the run still fails at the end so the hot failure stays visible.
          try {
            $hotResult = Invoke-FutBeatGlobalEndpoint ([ordered]@{
              source = "GOAL API"
              mode = "hot"
              dates = @($dates)
              providerRemaining = $hotRemaining
              events = @($events)
            })
            Write-Output "GLOBAL_INGEST_OK provider=GOAL_API accepted=$($hotResult.accepted)"
          } catch {
            $script:hotFailed = $true
            Write-Output "GLOBAL_INGEST_FAILED provider=GOAL_API error=$($_.Exception.Message)"
            if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
              Write-Output "GLOBAL_INGEST_FAILED_DETAIL $($_.ErrorDetails.Message)"
            }
          }

          }

          # On fresh quota the calendar goes first. 11-01 00:06: the hot store ran 80 s,
          # ended in 57014 and the database stayed slow for every date after it; the
          # first run of the day is the only one with quota for the calendar.
          $hotPending = $null -ne $globalQuota.plan.providerRemaining -and
            [int]$globalQuota.plan.providerRemaining -ge $expandFreshQuota
          if (-not $hotPending) { Invoke-HotWindow }

          function Complete-GlobalRun {
            if ($hotPending) { Invoke-HotWindow }
            if ($hotFailed -or $calendarFailures -gt 0) {
              Write-Output "GLOBAL_RUN_FAILED stage=hot"
              exit 1
            }
            exit 0
          }

          # Do not create another scheduled Action. The cold calendar expands on
          # manual runs, on the 09:17 UTC run, and on any scheduled run that finds
          # the daily GOAL quota fresh (ARCH-155): by 09:17 the quota is usually
          # below the 350 reserve (10-28/29: 333 and 282 left), so in practice the
          # first run after the 00:00 UTC reset expands. Bounded as before by the
          # request budget and the reserve; the plan returns only missing dates.
          $utcHour = [DateTime]::UtcNow.Hour

          $postHotQuota = Invoke-FutBeatGlobalEndpoint ([ordered]@{
            action = "global-quota-plan"
            reserve = $globalReserve
          })
          if ($postHotQuota.status -eq "skipped") {
            Write-Output "CALENDAR_EXPAND_SKIPPED reason=$($postHotQuota.plan.reason) remaining=$($postHotQuota.plan.providerRemaining) reserve=$globalReserve"
            Complete-GlobalRun
          }
          $postHotRemaining = $postHotQuota.plan.providerRemaining
          $shouldExpand = @("workflow_dispatch", "push") -contains $env:GITHUB_EVENT_NAME -or $utcHour -eq 9 -or
            ($null -ne $postHotRemaining -and [int]$postHotRemaining -ge $expandFreshQuota)
          Write-Output "CALENDAR_EXPAND_GATE expand=$shouldExpand remaining=$postHotRemaining fresh=$expandFreshQuota"

          $plan = Invoke-FutBeatGlobalEndpoint ([ordered]@{
            action = "calendar-plan"
            requestedOnly = $true
            limit = 12
          })
          $planDates = @($plan.dates)

          # Keep the near future warm on every run, not only once a day: the
          # plan returns only missing/stale dates, so quota use stays bounded.
          # The tiers add up: dates already planned must not close the next one
          # (BE-229). Budget and reserve bound the sum; the order is the priority.
          $nearToday = [DateTime]::UtcNow.Date
          $plan = Invoke-FutBeatGlobalEndpoint ([ordered]@{
            action = "calendar-plan"
            fromDate = $nearToday.AddDays(2).ToString("yyyy-MM-dd")
            toDate = $nearToday.AddDays(14).ToString("yyyy-MM-dd")
            requestedOnly = $false
            limit = 13
          })
          $planDates = @($planDates + @($plan.dates) | Select-Object -Unique)

          if ($shouldExpand) {
            $todayUtc = [DateTime]::UtcNow.Date
            $plan = Invoke-FutBeatGlobalEndpoint ([ordered]@{
              action = "calendar-plan"
              fromDate = $todayUtc.AddDays(-90).ToString("yyyy-MM-dd")
              toDate = $todayUtc.AddDays(180).ToString("yyyy-MM-dd")
              requestedOnly = $false
              limit = 45
            })
            $planDates = @($planDates + @($plan.dates) | Select-Object -Unique)
          }

          # Held as paid: stored by Resume-PendingDates, never paid twice.
          $planDates = @($planDates | Where-Object { -not (Test-Path (Get-PendingPath ([string]$_))) })

          if ($planDates.Count -eq 0) {
            $reason = if ($shouldExpand) { "coverage_fresh" } else { "no_requested_dates" }
            Write-Output "CALENDAR_EXPAND_OK dates=0 reason=$reason"
            Complete-GlobalRun
          }

          $quotaReserve = 350
          $calendarRequestBudget = 90
          # Without fresh quota only the near dates run, on a smaller budget.
          if (-not $shouldExpand) { $calendarRequestBudget = 45 }
          $calendarFailureLimit = 2
          $largeDateCalls = 15
          $largeDateFixtures = 800
          $retryPauseSeconds = 30
          $largeDatePauseSeconds = 20
          $lastRemaining = $postHotRemaining
          $calendarRequestsUsed = 0
          $consecutiveFailures = 0
          # One date per ingest call: a large date is stored in sub-batches
          # (futbeat-global-ingest v39) and takes ~40-50 s of the 90 s call.
          # A call may take 140 s (see $calendarCallSeconds): Edge stops at 150 s.
          $calendarDeadline = [DateTime]::UtcNow.AddMinutes(11)
          $batchSize = 1
          $batchDates = New-Object System.Collections.Generic.List[string]
          $batchEvents = New-Object System.Collections.Generic.List[object]
          $batchCoverage = New-Object System.Collections.Generic.List[object]
          $batchSeen = @{}
          $batchRemaining = $null
          $expandedDates = 0
          $stopForQuota = $false

          foreach ($date in $planDates) {
            # A date is fetched whole; a large one costs up to 15 pages and must
            # not cross the reserve halfway.
            if ($null -ne $lastRemaining -and $lastRemaining -le $quotaReserve + $largeDateCalls) {
              Write-Output "CALENDAR_EXPAND_STOP reason=quota_margin remaining=$lastRemaining"
              break
            }
            if ($calendarRequestsUsed -ge $calendarRequestBudget) {
              $stopForQuota = $true
              Write-Output "CALENDAR_EXPAND_STOP reason=request_budget budget=$calendarRequestBudget"
              break
            }
            # The job ends at 15 minutes; dates not reached stay in the plan.
            if ([DateTime]::UtcNow -ge $calendarDeadline) {
              Write-Output "CALENDAR_EXPAND_STOP reason=run_deadline"
              break
            }

            $page = Get-GoalApiDate ([string]$date) $quotaReserve
            $calendarRequestsUsed += [int]$page.Requests
            if ($null -ne $page.Remaining) {
              $batchRemaining = [int]$page.Remaining
              $lastRemaining = [int]$page.Remaining
            }
            Write-Output "CALENDAR_FETCH date=$date fixtures=$($page.Count) remaining=$($page.Remaining) requests=$($page.Requests) used=$calendarRequestsUsed"
            if ($page.Partial) {
              $stopForQuota = $true
              Write-Output "CALENDAR_DATE_PARTIAL date=$date fixtures=$($page.Count)"
              break
            }

            foreach ($fixture in @($page.Items)) {
              $externalId = [string]$fixture.apiId
              if ([string]::IsNullOrWhiteSpace($externalId)) {
                $externalId = [string]$fixture.id
              }
              if ([string]::IsNullOrWhiteSpace($externalId) -or $batchSeen.ContainsKey($externalId)) {
                continue
              }
              $batchSeen[$externalId] = $true
              [void]$batchEvents.Add($fixture)
            }

            [void]$batchDates.Add([string]$date)
            [void]$batchCoverage.Add([ordered]@{
              date = [string]$date
              count = [int]$page.Count
            })
            $expandedDates += 1

            if (
              ($null -ne $page.Remaining -and [int]$page.Remaining -le $quotaReserve) -or
              $calendarRequestsUsed -ge $calendarRequestBudget
            ) {
              $stopForQuota = $true
            }

            if ($batchDates.Count -ge $batchSize -or $stopForQuota) {
              # A date that fails must not stop the dates after it (BE-229: one
              # September date timed out on every run). It stays missing in the plan.
              # 57014 gets one more call with the same fixtures after a pause: no GOAL
              # page is paid again and the entity chunks stored are found unchanged.
              # 11-01 it hit dates of 59 and 88 fixtures too, so size does not decide.
              $calendarPayload = [ordered]@{
                source = "GOAL API"
                mode = "calendar"
                dates = $batchDates.ToArray()
                coverage = $batchCoverage.ToArray()
                providerRemaining = $batchRemaining
                events = $batchEvents.ToArray()
              }
              try {
                try {
                  $calendarResult = Invoke-FutBeatGlobalEndpoint $calendarPayload $calendarCallSeconds
                } catch {
                  if ("$($_.Exception.Message) $($_.ErrorDetails.Message)" -notmatch "57014") {
                    throw
                  }
                  Write-Output "CALENDAR_INGEST_RETRY date=$($batchDates -join ',') reason=57014"
                  Start-Sleep -Seconds $retryPauseSeconds
                  $calendarResult = Invoke-FutBeatGlobalEndpoint $calendarPayload $calendarCallSeconds
                }
                # v44 answers 200 skipped past 64 ingests a day: nothing was stored
                # and every later date would spend GOAL the same way.
                if ($calendarResult.status -eq "skipped") {
                  Write-Output "CALENDAR_EXPAND_STOP reason=ingest_skipped detail=$($calendarResult.reason)"
                  $batchDates.Clear()
                  break
                }
                Write-Output "CALENDAR_INGEST_OK dates=$($batchDates.Count) accepted=$($calendarResult.accepted)"
                $consecutiveFailures = 0
                if ($calendarResult.deferredDates) {
                  Write-Output "CALENDAR_INGEST_DEFERRED dates=$(@($calendarResult.deferredDates) -join ',')"
                }
              } catch {
                $calendarFailures += 1
                $consecutiveFailures += 1
                Write-Output "CALENDAR_INGEST_FAILED date=$($batchDates -join ',') error=$($_.Exception.Message)"
                Save-PendingDate $calendarPayload
              }

              $batchDates = New-Object System.Collections.Generic.List[string]
              $batchEvents = New-Object System.Collections.Generic.List[object]
              $batchCoverage = New-Object System.Collections.Generic.List[object]
              $batchSeen = @{}
              $batchRemaining = $null

              if ($stopForQuota) {
                Write-Output "CALENDAR_EXPAND_STOP reason=quota_reserve reserve=$quotaReserve"
                break
              }
              # Two dates in a row point at the database, whatever their size: no more
              # pages are paid. Failing Saturdays cannot freeze the plan any more: a
              # date that failed twice rests and the next run moves past it.
              if ($consecutiveFailures -ge $calendarFailureLimit) {
                Write-Output "CALENDAR_EXPAND_STOP reason=ingest_failures failures=$calendarFailures"
                break
              }
              if ($page.Count -ge $largeDateFixtures) {
                Start-Sleep -Seconds $largeDatePauseSeconds
              }
            }
          }

          Write-Output "CALENDAR_EXPAND_OK planned=$($planDates.Count) fetched=$expandedDates requests=$calendarRequestsUsed"

          if ($stopForQuota) {
            Write-Output "CALENDAR_EXPAND_COMPLETE reason=quota_guard"
          }
          Complete-GlobalRun

      - name: Save paid calendar dates
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: calendar-pending
          key: calendar-pending-${{ github.run_id }}
