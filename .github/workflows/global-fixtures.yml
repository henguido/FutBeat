name: FutBeat global fixtures

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-fixtures.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: futbeat-global-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Collect and ingest global football calendar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            "Accept" = "application/json,text/plain,*/*"
            "Origin" = "https://www.sofascore.com"
            "Referer" = "https://www.sofascore.com/"
            "User-Agent" = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36"
          }
          $bases = @(
            "https://api.sofascore.com/api/v1",
            "https://www.sofascore.com/api/v1"
          )

          $crNow = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-6))
          $dates = @(-1, 0, 1) | ForEach-Object {
            $crNow.Date.AddDays($_).ToString("yyyy-MM-dd")
          }

          $allEvents = [System.Collections.Generic.List[object]]::new()

          foreach ($date in $dates) {
            $response = $null
            $lastError = $null

            foreach ($base in $bases) {
              $url = "$base/sport/football/scheduled-events/$date"
              try {
                $candidate = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 15
                if (-not ($candidate.PSObject.Properties.Name -contains "events")) {
                  throw "Invalid events payload"
                }

                $dateEvents = @($candidate.events)
                foreach ($event in $dateEvents) {
                  if ($null -ne $event) {
                    $allEvents.Add($event)
                  }
                }

                Write-Output "GLOBAL_FETCH date=$date events=$($dateEvents.Count) base=$base"
                $response = $candidate
                break
              } catch {
                $lastError = $_.Exception.Message
                Write-Warning "Global schedule attempt failed for $($url): $lastError"
              }
            }

            if ($null -eq $response) {
              throw "Global calendar unavailable for $($date): $lastError"
            }
          }

          $payloadObject = [ordered]@{
            source = "SofaScore"
            dates = @($dates)
            events = @($allEvents)
          }
          $payloadObject |
            ConvertTo-Json -Depth 100 -Compress |
            Set-Content -Path "global-fixtures.json" -Encoding utf8NoBOM

          Write-Output "GLOBAL_FETCH_TOTAL events=$($allEvents.Count)"

          $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=futbeat-global-ingest"
          $oidcParams = @{
            Uri = $oidcUrl
            Headers = @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            TimeoutSec = 15
          }
          $oidc = Invoke-RestMethod @oidcParams

          $token = [string]$oidc.value
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "GitHub OIDC token was not issued"
          }
          Write-Output "::add-mask::$token"

          $body = Get-Content -Raw -Path "global-fixtures.json"
          $ingestParams = @{
            Uri = "https://izlmruqawgagwdcsjhte.supabase.co/functions/v1/futbeat-global-ingest"
            Method = "Post"
            Headers = @{ Authorization = "Bearer $token" }
            ContentType = "application/json"
            Body = $body
            TimeoutSec = 90
          }
          $result = Invoke-RestMethod @ingestParams

          Write-Output "GLOBAL_INGEST_OK"
          $result | ConvertTo-Json -Depth 20 -Compress
