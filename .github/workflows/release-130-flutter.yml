name: Release 130 Flutter verification
run-name: Release 130 Flutter @ ${{ github.sha }}

on:
  push:
    branches:
      - codex/release-130-ci-play

permissions:
  contents: read

concurrency:
  group: release-130-flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/release-130-ci-play'
    name: Flutter 3.47.4 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: America/Costa_Rica
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact source and lockfile
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-130-flutter
          git rev-parse HEAD | tee artifacts/release-130-flutter/source-sha.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum apps/mobile/pubspec.lock | tee artifacts/release-130-flutter/pubspec-lock-before.sha256
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            date -u +"started_utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee artifacts/release-130-flutter/run-metadata.txt

      - name: Check runner loopback
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee artifacts/release-130-flutter/loopback.log
          import socket

          listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          client = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          accepted = None
          try:
              listener.bind(("127.0.0.1", 0))
              listener.listen(1)
              listener.settimeout(5)
              client.settimeout(5)
              client.connect(listener.getsockname())
              accepted, _ = listener.accept()
              print("LOOPBACK_PASS address=127.0.0.1")
          finally:
              if accepted is not None:
                  accepted.close()
              client.close()
              listener.close()
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Record Flutter toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version 2>&1 | tee ../../artifacts/release-130-flutter/flutter-version.log
          dart --version 2>&1 | tee ../../artifacts/release-130-flutter/dart-version.log

      - name: Resolve exact locked dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee ../../artifacts/release-130-flutter/pub-get.log

      - name: Verify lockfile unchanged
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sha256sum apps/mobile/pubspec.lock | tee artifacts/release-130-flutter/pubspec-lock-after.sha256
          diff -u artifacts/release-130-flutter/pubspec-lock-before.sha256 artifacts/release-130-flutter/pubspec-lock-after.sha256
          git diff --exit-code -- apps/mobile/pubspec.lock

      - name: Flutter analyze
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee ../../artifacts/release-130-flutter/analyze.log

      - name: Critical focused tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=2 --reporter=expanded \
            --exclude-tags=golden \
            test/news_feed_v2_adapter_test.dart \
            test/news_screen_test.dart \
            test/news_link_test.dart \
            test/news_transfers_v1_test.dart \
            test/auth_flows_test.dart \
            test/auth_sheet_test.dart \
            test/account_link_test.dart \
            test/account_lifecycle_test.dart \
            test/password_reset_cold_start_test.dart \
            test/onboarding_test.dart \
            test/favorites_hub_v2_test.dart \
            test/flow_test.dart \
            test/profile_v2_test.dart \
            test/match_center_hero_test.dart \
            test/match_center_player_navigation_test.dart \
            test/match_center_team_statistics_test.dart \
            test/match_detail_e2e_test.dart \
            test/score_correction_test.dart \
            test/live_bootstrap_test.dart \
            test/public_offline_cache_test.dart \
            test/ads_test.dart \
            2>&1 | tee ../../artifacts/release-130-flutter/focused.log

      - name: Complete functional Flutter suite
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=2 --reporter=expanded \
            --exclude-tags=golden \
            2>&1 | tee ../../artifacts/release-130-flutter/full.log

      - name: Build isolated QA APK 1.0.0+6
        if: success()
        env:
          FUTBEAT_QA_ISOLATED_PACKAGE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub \
            --build-name=1.0.0 \
            --build-number=6 \
            --dart-define=FUTBEAT_ADMOB_TEST_ADS=true
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee ../../artifacts/release-130-flutter/qa-apk.sha256
          cp "$apk" ../../artifacts/release-130-flutter/FutBeat-QA-1.0.0+6.apk

      - name: Visual regression evidence (non-blocking platform diagnostic)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=2 --reporter=expanded \
            --tags=golden \
            2>&1 | tee ../../artifacts/release-130-flutter/golden.log

      - name: Prove tracked goldens were not updated
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/mobile/test/goldens
          if git status --porcelain --untracked-files=all -- apps/mobile/test/goldens | grep -q .; then
            echo "Golden files changed or were created; refusing the run."
            git status --short -- apps/mobile/test/goldens
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-130-flutter-${{ github.sha }}
          path: |
            artifacts/release-130-flutter/
            apps/mobile/test/failures/
          if-no-files-found: warn
          retention-days: 30
