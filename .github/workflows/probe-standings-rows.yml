name: Probe GOAL standings rows

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-standings-rows.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
    steps:
      - name: Inspect standings stages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GOAL_API_KEY)) { throw "Missing GOAL_API_KEY" }
          Write-Output "::add-mask::$env:GOAL_API_KEY"
          $headers = @{ Authorization = "Bearer $env:GOAL_API_KEY"; Accept = "application/json" }
          $leagueId = "cmr77dwvj00o4rx06obpfwwsh"
          $response = Invoke-RestMethod -Uri "https://api.goal-api.com/v1/standings/$leagueId" -Headers $headers -TimeoutSec 30
          if (-not $response.success) { throw "Probe failed" }
          foreach ($row in @($response.data)) {
            Write-Output ("ROW position={0} team={1} stage={2} round={3} season={4} created={5} updated={6}" -f $row.overallLeaguePosition,$row.teamName,$row.stageName,$row.leagueRound,$row.season,$row.createdAt,$row.updatedAt)
          }